name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # to post the coverage comment on PRs
      contents: write       # to store coverage data/badge on a branch
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev, viz]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=mspdetect
      - name: Coverage comment
        if: matrix.python-version == '3.12' # report once, not four times
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
